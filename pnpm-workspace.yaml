packages:
  - "packages/*"

# Supply-chain security (https://pnpm.io/supply-chain-security)
minimumReleaseAge: 1440 # 24h delay before a newly-published version is installable
blockExoticSubdeps: true # transitive deps must come from the registry, not git/tarball URLs
trustPolicy: no-downgrade # refuse a package version whose trust signals regressed

# esbuild is a transitive dependency of tsx; its postinstall only downloads
# the matching platform-specific native binary from the registry (a common,
# well-established pattern shared by esbuild/swc/turbopack) — no other
# scripts are allowed to run.
#
# nx's postinstall only checks/updates the Nx Cloud client when Nx Cloud is
# configured (a no-op here, since this workspace uses local-only caching)
# and asserts platform support; it has a 30s timeout and degrades
# gracefully on any error.
allowBuilds:
  esbuild: true
  nx: true

# @nx/js pulls in @babel/core -> semver@6.3.1, which lacks provenance
# attestation (published 2023-07-10 on the old, backport-only 6.x
# maintenance line — the actively-developed 7.x line does have
# provenance). Rather than exempting the trust-downgrade check for the
# untrusted old version, force resolution to a trusted 7.x release
# instead; semver's basic comparison API @babel/core relies on is stable
# across that boundary.
#
# googleapis-common (a dependency of @googleapis/script and
# @googleapis/sheets) exactly pins google-auth-library@10.5.0, while
# @google-cloud/local-auth wants ^9.0.0 — left alone, pnpm would install
# two separate copies of OAuth2Client. That's a real problem, not just
# bloat: OAuth2Client has private members, so TypeScript treats two
# separately-installed copies (even identical versions) as nominally
# incompatible, and a client built from one copy can't be passed where
# the other is expected. Force everyone onto googleapis-common's exact
# version — local-auth's usage (constructing an OAuth2Client, exchanging
# a code for tokens, setCredentials) is basic, long-stable OAuth2Client
# API, unlikely to have changed in a way that matters between 9.x and
# 10.5.0.
overrides:
  semver: 7.8.4
  google-auth-library: 10.5.0
